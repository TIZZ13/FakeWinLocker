name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build WinLockKFC
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Check out the commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the Windows build toolchain
        shell: pwsh
        run: |
          $missing = @()

          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (-not (Test-Path -LiteralPath $csc)) { $missing += 'csc.exe (.NET Framework 4.x)' }

          $ref = Join-Path ${env:ProgramFiles(x86)} 'Reference Assemblies\Microsoft\Framework\.NETFramework\v4.8'
          if (-not (Test-Path -LiteralPath $ref)) { $missing += '.NET Framework 4.8 reference assemblies' }

          $rc = Get-ChildItem -LiteralPath (Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin') -Recurse -Filter rc.exe -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match '\\x64\\rc\.exe$' } |
                Sort-Object FullName -Descending |
                Select-Object -First 1
          if (-not $rc) { $missing += 'rc.exe (Windows SDK)' }

          $sevenZip = (Get-Command 7z.exe -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip) { $sevenZip = 'C:\Program Files\7-Zip\7z.exe' }
          if (-not (Test-Path -LiteralPath $sevenZip)) { $missing += '7-Zip' }

          "csc.exe:   $csc"
          "refs:      $ref"
          "rc.exe:    $($rc.FullName)"
          "7-Zip:     $sevenZip"
          "runner:    $env:ImageOS $env:ImageVersion"

          if ($missing.Count) { throw ('Missing build tools: ' + ($missing -join ', ')) }

      - name: Build WinLockKFC.exe
        shell: pwsh
        run: ./build.ps1

      - name: Pack the release files and write SHA256SUMS.txt
        shell: pwsh
        run: |
          $binary = 'WinLockKFC.exe'
          $archive = 'WinLockerKFC.7z'
          if (-not (Test-Path -LiteralPath $binary)) { throw "build.ps1 did not produce $binary" }

          $sevenZip = (Get-Command 7z.exe -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip) { $sevenZip = 'C:\Program Files\7-Zip\7z.exe' }

          $readme = Get-ChildItem -Filter 'README_*.txt' -File | Select-Object -First 1
          $packed = @($binary)
          if ($readme) { $packed += $readme.FullName }

          & $sevenZip a -t7z -mx=9 -p123 -mhe=on -y $archive @packed
          if ($LASTEXITCODE -ne 0) { throw "7z failed with exit code $LASTEXITCODE" }

          $lines = foreach ($file in @($binary, $archive)) {
            $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            '{0}  {1}' -f $hash, (Split-Path -Leaf $file)
          }
          Set-Content -LiteralPath 'SHA256SUMS.txt' -Value ($lines -join "`n") -Encoding ascii -NoNewline

          Get-Item -LiteralPath $binary, $archive | ForEach-Object { '{0}  {1:N0} bytes' -f $_.Name, $_.Length }
          Get-Content -LiteralPath 'SHA256SUMS.txt'

      - name: Keep the build as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: WinLockerKFC-${{ github.run_id }}
          path: |
            WinLockKFC.exe
            WinLockerKFC.7z
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

      - name: Attest the build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            WinLockKFC.exe
            WinLockerKFC.7z

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $sums = (Get-Content -LiteralPath 'SHA256SUMS.txt') -join "`n"

          $notes = @"
          Собрано GitHub Actions из коммита $env:GITHUB_SHA — [журнал сборки](https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID).

          ### Проверка файла / Verify the file

          ```powershell
          Get-FileHash .\WinLockKFC.exe -Algorithm SHA256
          gh attestation verify WinLockKFC.exe --repo $env:GITHUB_REPOSITORY
          ```

          Суммы всех файлов — в `SHA256SUMS.txt`.

          ```
          $sums
          ```

          ---

          Built by GitHub Actions from $env:GITHUB_SHA.
          "@
          Set-Content -LiteralPath 'release-notes.md' -Value $notes -Encoding utf8

          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            "Release $tag already exists — uploading the files again."
            gh release upload $tag WinLockKFC.exe WinLockerKFC.7z SHA256SUMS.txt --clobber
          } else {
            gh release create $tag WinLockKFC.exe WinLockerKFC.7z SHA256SUMS.txt `
              --title "WinLockerKFC $tag" `
              --notes-file release-notes.md `
              --verify-tag
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release failed with exit code $LASTEXITCODE" }

          gh release view $tag --json url --jq '.url'
